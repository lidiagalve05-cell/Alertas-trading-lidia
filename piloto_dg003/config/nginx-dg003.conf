server {
    listen 443 ssl;
    server_name piloto.example.invalid;
    ssl_certificate /etc/dg003/tls/fullchain.pem;
    ssl_certificate_key /etc/dg003/tls/privkey.pem;

    location = /velas.json {
        alias /var/lib/dg003-recoger/publico/velas.json;
        default_type application/json;
        add_header Cache-Control "no-store, no-cache, max-age=0" always;
        limit_except GET { deny all; }
    }

    location / { return 404; }
}
