name: Recopilar precios cripto

on:
  schedule:
    - cron: '2-59/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: recopilar-precios-${{ github.ref }}
  cancel-in-progress: false

jobs:
  recopilar:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: pip install requests

      - name: Recopilar datos
        run: python recopilar_datos.py

      - name: Guardar resultados
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add datos-cripto.csv
          if ! git diff --cached --quiet; then
            git commit -m "Actualizar datos de criptomonedas"
            git push
          fi

      - name: Verificar el CSV en la rama remota
        run: |
          git fetch --no-tags --depth=1 origin "$GITHUB_REF"
          esperado=$(git hash-object datos-cripto.csv)
          publicado=$(git rev-parse FETCH_HEAD:datos-cripto.csv)
          if [[ "$publicado" != "$esperado" ]]; then
            echo "::error::El CSV remoto no coincide con el generado"
            exit 1
          fi
          echo "CSV verificado en $GITHUB_REF (blob $publicado)"

      - name: Comprobar frescura del CSV publicado
        run: python recopilar_datos.py --comprobar-frescura
