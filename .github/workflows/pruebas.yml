name: Pruebas del recopilador

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  pruebas:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: python -m pip install requests

      - name: Ejecutar pruebas y comprobar que el CSV conserva el historial
        run: |
          export CSV_BASE="$RUNNER_TEMP/datos-cripto-base.csv"
          git show HEAD^1:datos-cripto.csv > "$CSV_BASE"
          python -m unittest discover -s tests -v
